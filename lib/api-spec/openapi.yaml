openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: blue-files
    description: Blue file inventory and rack locations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /blue-file-records:
    get:
      operationId: listBlueFiles
      tags: [blue-files]
      summary: List blue file records
      responses:
        "200":
          description: Blue file records ordered by storage location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecordList"
    post:
      operationId: createBlueFile
      tags: [blue-files]
      summary: Add a blue file record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileRecordInput"
      responses:
        "201":
          description: Created blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Work order or storage place is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/summary:
    get:
      operationId: getBlueFilesSummary
      tags: [blue-files]
      summary: Get inventory capacity and area summaries
      responses:
        "200":
          description: Inventory capacity, utilization, and area breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileSummary"
  /blue-file-records/import:
    post:
      operationId: importBlueFiles
      tags: [blue-files]
      summary: Import and update records from a spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileImportInput"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileImportResult"
        "400":
          description: Invalid import data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Import contains duplicate work orders or places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateBlueFile
      tags: [blue-files]
      summary: Edit a blue file record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileRecordInput"
      responses:
        "200":
          description: Updated blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "400":
          description: Invalid record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Work order or storage place is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBlueFile
      tags: [blue-files]
      summary: Delete a blue file record
      responses:
        "204":
          description: Record deleted
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: moveBlueFile
      tags: [blue-files]
      summary: Move a record to another rack location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileLocationInput"
      responses:
        "200":
          description: Updated blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "400":
          description: Invalid storage place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Storage place is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: setBlueFileStatus
      tags: [blue-files]
      summary: Move a record between its rack slot and the Transit Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileStatusInput"
      responses:
        "200":
          description: Updated blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Borrowed files must be returned first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/{id}/borrow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: borrowBlueFile
      tags: [blue-files]
      summary: Record that a blue file has been borrowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileBorrowInput"
      responses:
        "200":
          description: Updated blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "400":
          description: Invalid borrower or date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blue file is already borrowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-records/{id}/return:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: returnBlueFile
      tags: [blue-files]
      summary: Return a borrowed blue file to its rack slot or the Transit Area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueFileReturnInput"
      responses:
        "200":
          description: Updated blue file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileRecord"
        "400":
          description: Invalid return date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blue file is not currently borrowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blue-file-loans:
    get:
      operationId: listBlueFileLoans
      tags: [blue-files]
      summary: Borrowing history for all blue files, newest first
      responses:
        "200":
          description: Every loan, open and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueFileLoanList"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BlueFileStatus:
      type: string
      enum: [available, borrowed, in_transit]
    BlueFileRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        no:
          type: [integer, "null"]
        wo:
          type: string
        complete:
          type: [string, "null"]
        place:
          type: string
        area:
          type: string
        rack:
          type: integer
        position:
          type: string
          enum: [L, M, R]
        slot:
          type: integer
        date_in:
          type: [string, "null"]
        time_in:
          type: [string, "null"]
        pic:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/BlueFileStatus"
        current_location:
          type: string
          description: "Where the file is right now, e.g. Rack A01L-001, Transit Area, Borrowed by Jane"
        borrower_name:
          type: [string, "null"]
        borrowed_at:
          type: [string, "null"]
          format: date-time
        borrow_remarks:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - no
        - wo
        - complete
        - place
        - area
        - rack
        - position
        - slot
        - date_in
        - time_in
        - pic
        - status
        - current_location
        - borrower_name
        - borrowed_at
        - borrow_remarks
        - created_at
        - updated_at
    BlueFileRecordList:
      type: array
      items:
        $ref: "#/components/schemas/BlueFileRecord"
    BlueFileRecordInput:
      type: object
      properties:
        no:
          type: [integer, "null"]
        wo:
          type: string
          minLength: 1
        complete:
          type: [string, "null"]
        place:
          type: string
          minLength: 1
        area:
          type: string
          minLength: 1
        rack:
          type: integer
          minimum: 1
        position:
          type: string
          enum: [L, M, R]
        slot:
          type: integer
          minimum: 1
        date_in:
          type: [string, "null"]
        time_in:
          type: [string, "null"]
        pic:
          type: [string, "null"]
      required: [wo, place, area, rack, position, slot]
    BlueFileLocationInput:
      type: object
      properties:
        place:
          type: string
          minLength: 1
      required: [place]
    BlueFileImportInput:
      type: object
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/BlueFileRecordInput"
      required: [records]
    BlueFileImportResult:
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
      required: [inserted, updated]
    BlueFileAreaSummary:
      type: object
      properties:
        area:
          type: string
        occupied:
          type: integer
        racks:
          type: integer
        max_rack:
          type: integer
        max_slot:
          type: integer
        capacity:
          type: integer
      required: [area, occupied, racks, max_rack, max_slot, capacity]
    BlueFileSummary:
      type: object
      properties:
        total_capacity:
          type: integer
        occupied:
          type: integer
        empty:
          type: integer
        utilization:
          type: number
        total_files:
          type: integer
        available_files:
          type: integer
        borrowed_files:
          type: integer
        in_transit_files:
          type: integer
        areas:
          type: array
          items:
            $ref: "#/components/schemas/BlueFileAreaSummary"
      required:
        - total_capacity
        - occupied
        - empty
        - utilization
        - total_files
        - available_files
        - borrowed_files
        - in_transit_files
        - areas
    BlueFileStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [available, in_transit]
      required: [status]
    BlueFileBorrowInput:
      type: object
      properties:
        borrower_name:
          type: string
          minLength: 1
        borrowed_at:
          type: [string, "null"]
          format: date-time
          description: Defaults to now
        remarks:
          type: [string, "null"]
      required: [borrower_name]
    BlueFileReturnInput:
      type: object
      properties:
        return_to:
          type: string
          enum: [available, in_transit]
        returned_at:
          type: [string, "null"]
          format: date-time
          description: Defaults to now
        remarks:
          type: [string, "null"]
      required: [return_to]
    BlueFileLoan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        record_id:
          type: [string, "null"]
          format: uuid
        no:
          type: [integer, "null"]
        wo:
          type: string
        place:
          type: string
        borrower_name:
          type: string
        borrowed_at:
          type: string
          format: date-time
        borrow_remarks:
          type: [string, "null"]
        returned_at:
          type: [string, "null"]
          format: date-time
        returned_to:
          type: [string, "null"]
          enum: [available, in_transit, null]
        return_remarks:
          type: [string, "null"]
        duration_minutes:
          type: integer
          description: Minutes borrowed so far (open loans) or in total (returned loans)
        is_active:
          type: boolean
      required:
        - id
        - record_id
        - no
        - wo
        - place
        - borrower_name
        - borrowed_at
        - borrow_remarks
        - returned_at
        - returned_to
        - return_remarks
        - duration_minutes
        - is_active
    BlueFileLoanList:
      type: array
      items:
        $ref: "#/components/schemas/BlueFileLoan"
